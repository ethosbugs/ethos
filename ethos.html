<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a12">
<title>ETHOS PLAYER • NEON v3.2</title>
<style>
:root {
  --g: #00ff9d; --c: #00f7ff; --p: #ff00ff; --red: #ff3366;
  --bg: #0a0a12; --panel: rgba(20, 25, 40, .95); --line: rgba(0, 255, 157, .3);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh; background: var(--bg); color: var(--g);
  font-family: 'Courier New', monospace; overflow-x: hidden;
}
canvas#matrix {
  position: fixed; inset: 0; width: 100%; height: 100%;
  z-index: 0; opacity: .3; pointer-events: none;
}
.grid-bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: linear-gradient(rgba(0,255,157,.03) 1px, transparent 1px),
              linear-gradient(90deg, rgba(0,255,157,.03) 1px, transparent 1px);
  background-size: 60px 60px; animation: gridMove 40s linear infinite;
}
@keyframes gridMove { to { background-position: 60px 60px; } }
.wrap { position: relative; z-index: 1; }

:focus-visible { outline: 2px solid var(--c); outline-offset: 3px; }

/* Controles */
.btn, .input {
  background: rgba(0,0,0,.85); border: 2px solid var(--g); color: #fff;
  padding: 12px 20px; border-radius: 50px; font: inherit; font-size: 1rem;
}
.btn { cursor: pointer; transition: transform .2s, background .2s, color .2s; }
.btn:hover { background: #fff; color: #000; transform: scale(1.05); }
.btn.danger { border-color: var(--red); }
.btn.danger:hover { background: var(--red); color: #fff; }
.btn.small { padding: 8px 16px; font-size: .9rem; }
.input::placeholder { color: rgba(255,255,255,.45); }

/* Cabecera */
header.top {
  position: sticky; top: 0; z-index: 30; padding: 16px 40px;
  background: rgba(10,12,25,.97); border-bottom: 2px solid var(--g);
  display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
}
.logo { font-size: 2.2rem; font-weight: 900; letter-spacing: 4px; display: flex; align-items: center; gap: 8px; color: var(--g); text-decoration: none; }
.logo::before { content: ">"; font-size: 2.6rem; text-shadow: 0 0 20px var(--g); }
.controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* Categorías */
.cat-bar {
  padding: 14px 40px; background: rgba(12,15,30,.95);
  display: flex; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--line);
}
.cat-btn {
  background: transparent; border: 2px solid var(--g); color: #fff; font: inherit;
  padding: 8px 22px; border-radius: 50px; cursor: pointer; transition: all .3s;
}
.cat-btn.active, .cat-btn:hover { background: var(--g); color: #000; box-shadow: 0 0 20px var(--g); }

/* Juegos */
.games {
  padding: 40px; display: grid; gap: 25px;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
}
.card {
  background: var(--panel); border: 2px solid var(--g); border-radius: 16px;
  padding: 20px; cursor: pointer; position: relative;
  transition: transform .3s, border-color .3s, box-shadow .3s;
}
.card:hover, .card:focus-visible { transform: translateY(-8px); border-color: #fff; box-shadow: 0 0 30px rgba(0,255,157,.3); }
.card img {
  width: 100%; height: 170px; object-fit: contain; background: #0f0f1f;
  border: 1px solid rgba(0,255,157,.2); border-radius: 12px; padding: 10px;
}
.card h3 { font-size: 1.4rem; margin: 12px 0 4px; color: #fff; word-break: break-word; }
.card small { opacity: .7; }
.fav {
  position: absolute; top: 14px; right: 14px; font-size: 1.8rem; line-height: 1;
  background: none; border: 0; color: var(--g); cursor: pointer; z-index: 2;
}
.skeleton { height: 290px; cursor: default; animation: pulse 1.2s ease-in-out infinite alternate; }
@keyframes pulse { from { opacity: .35; } to { opacity: .8; } }
.empty { grid-column: 1 / -1; text-align: center; padding: 60px 0; opacity: .8; font-size: 1.2rem; }
.empty.error { color: #ff5555; opacity: 1; }
.counter { position: fixed; bottom: 20px; right: 30px; z-index: 35; font-size: 1.1rem; text-shadow: 0 0 10px #000; }

/* Reproductor */
.player { position: fixed; inset: 0; z-index: 100; background: #000; display: none; flex-direction: column; }
.player.open { display: flex; }
.player-bar { display: flex; align-items: center; gap: 10px; padding: 10px 20px; background: rgba(10,12,25,.98); border-bottom: 2px solid var(--g); }
.player-bar strong { flex: 1; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player iframe { flex: 1; width: 100%; border: 0; background: #000; }

/* Toast */
.toast {
  position: fixed; bottom: 70px; left: 50%; transform: translate(-50%, 20px); z-index: 200;
  background: #000; border: 2px solid var(--g); color: #fff; padding: 12px 24px; border-radius: 50px;
  opacity: 0; pointer-events: none; transition: all .3s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.err { border-color: var(--red); }

/* Landing */
.center { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; }
.holo-logo {
  width: min(320px, 70vw); aspect-ratio: 1; border: 6px solid var(--g); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 100px var(--g), inset 0 0 80px rgba(0,255,157,.5);
  animation: holoPulse 4s ease-in-out infinite alternate;
}
.holo-logo span { font-size: clamp(2rem, 9vw, 5rem); font-weight: 900; letter-spacing: .2em; margin-right: -.2em; color: var(--c); text-shadow: 0 0 40px var(--p); }
@keyframes holoPulse { to { box-shadow: 0 0 130px var(--g), 0 0 200px var(--p); } }
.title { margin-top: 40px; font-size: clamp(1.6rem, 6vw, 3.4rem); letter-spacing: .2em; color: var(--c); }
.sub { margin-top: 16px; font-size: 1.2rem; opacity: .9; }
.enter-btn {
  margin-top: 50px; padding: 20px 70px; font: inherit; font-size: 1.8rem; letter-spacing: 8px;
  background: transparent; border: 3px solid var(--g); color: var(--g); cursor: pointer; border-radius: 8px; transition: all .4s;
}
.enter-btn:hover { background: var(--p); border-color: var(--p); color: #000; box-shadow: 0 0 60px var(--p); transform: scale(1.06); }
.admin-link { margin-top: 60px; color: var(--p); text-decoration: none; opacity: .75; }
.admin-link:hover { opacity: 1; }

/* Admin */
.gate { position: fixed; inset: 0; z-index: 150; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 20px; }
.gate form { width: min(380px, 100%); display: grid; gap: 14px; text-align: center; }
.gate h1, .admin h1 { color: var(--p); }
.gate .msg { min-height: 1.3em; color: var(--red); }
.admin { max-width: 900px; margin: 0 auto; padding: 30px 20px 80px; }
.admin-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
.form { display: grid; gap: 12px; }
.form .input { border-radius: 8px; width: 100%; color: var(--g); }
.row { display: flex; gap: 10px; }
.row .btn { flex: 1; border-radius: 8px; font-weight: bold; }
.list-head { margin: 40px 0 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.game-item {
  background: var(--panel); padding: 14px; margin: 10px 0; border: 1px solid var(--g); border-radius: 10px;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
}
.game-item .info { display: flex; align-items: center; gap: 12px; min-width: 0; }
.game-item img { width: 52px; height: 52px; object-fit: contain; background: #0f0f1f; border-radius: 8px; flex: none; }
.game-item .info div { min-width: 0; word-break: break-word; }
.game-item .acts { display: flex; gap: 8px; flex: none; }

@media (max-width: 640px) {
  header.top, .cat-bar, .games { padding-left: 16px; padding-right: 16px; }
  .controls { width: 100%; } .controls .input { flex: 1; min-width: 0; }
  .game-item { flex-direction: column; align-items: stretch; }
  .enter-btn { padding: 16px 40px; font-size: 1.4rem; }
}

/* Extras v3.2 */
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 40px 0}
.toolbar select{appearance:none;padding-right:20px}
.sec-title{grid-column:1/-1;font-size:1.1rem;color:var(--c);letter-spacing:.15em;margin-top:6px}
.chip-n{opacity:.6;margin-left:6px;font-size:.85em}
.btn:disabled{opacity:.5;cursor:wait}
.hint{opacity:.6;font-size:.9rem}
.admin .hint{margin-top:6px}
.card .badge{position:absolute;left:14px;top:14px;background:var(--p);color:#000;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:50px;z-index:2}
@media (max-width:640px){.toolbar{padding:12px 16px 0}}
[hidden]{display:none!important}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
<canvas id="matrix"></canvas>

<div class="wrap">
  <header class="top">
    <a class="logo" href="index.html">ETHOS PLAYER</a>
    <div class="controls">
      <input class="input" type="search" id="searchBar" placeholder="Buscar juego (pulsa /)" aria-label="Buscar juego" style="width:240px">
      <button class="btn" id="btnRandom" title="Abrir un juego al azar">🎲 SORPRÉNDEME</button>
      <button class="btn" id="btnAI">ETHOS AI</button>
      <button class="btn" id="btnSpotify">SPOTIFY</button>
      <button class="btn" onclick="location.href='admin.html'">ADMIN</button>
    </div>
  </header>

  <nav class="cat-bar" id="catBar" aria-label="Categorías"></nav>
  <div class="toolbar">
    <span class="hint" id="counter">0 JUEGOS</span>
    <select class="input" id="sort" aria-label="Ordenar">
      <option value="az">Orden: A → Z</option>
      <option value="new">Orden: más recientes</option>
    </select>
  </div>
  <main class="games" id="lista" aria-live="polite"></main>
</div>

<div class="player" id="player" role="dialog" aria-modal="true" aria-label="Juego">
  <div class="player-bar">
    <strong id="playerTitle"></strong>
    <button class="btn small" id="btnReload" title="Recargar el juego">↻ Recargar</button>
    <button class="btn small" id="btnFull" title="Pantalla completa">⛶ Pantalla completa</button>
    <button class="btn small" id="btnBlank" title="Abrir en pestaña about:blank">↗ Nueva pestaña</button>
    <button class="btn small danger" id="btnClose">✕ Cerrar</button>
  </div>
  <iframe id="playerFrame" title="Juego" allow="fullscreen; autoplay; gamepad; clipboard-write"></iframe>
</div>

<script>
// Misma configuración y misma colección ("games") que antes: los datos no cambian.
const firebaseConfig = {
  apiKey: "AIzaSyBEtMYOTg4fBGyShbULdGCuW76nwlUIfiI",
  authDomain: "ethosgames-a1bc1.firebaseapp.com",
  projectId: "ethosgames-a1bc1",
  storageBucket: "ethosgames-a1bc1.firebasestorage.app",
  messagingSenderId: "877649560017",
  appId: "1:877649560017:web:598a7bc006323627ab60f0"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
</script>
<script>
// Utilidades compartidas
const $ = id => document.getElementById(id);

// Escapa texto antes de meterlo en innerHTML (evita XSS)
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Solo permite http(s); bloquea javascript:, data:, etc.
function safeUrl(u) {
  try {
    const x = new URL(String(u || "").trim());
    return ["http:", "https:"].includes(x.protocol) ? x.href : "";
  } catch { return ""; }
}

let toastTimer;
function toast(msg, error = false) {
  let t = $("toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.className = "toast show" + (error ? " err" : "");
  t.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

// Fondo Matrix (pausa si la pestaña no está visible o si el usuario reduce animaciones)
function startMatrix() {
  const canvas = $("matrix");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const chars = "01アイウエオETHOS▓▒░█◆◇";
  let drops = [];
  function resize() {
    canvas.width = innerWidth; canvas.height = innerHeight;
    drops = Array(Math.floor(canvas.width / 18)).fill(1);
  }
  resize(); addEventListener("resize", resize);
  setInterval(() => {
    if (document.hidden) return;
    ctx.fillStyle = "rgba(10,12,20,0.1)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#00ff9d"; ctx.font = "15px monospace";
    drops.forEach((y, i) => {
      ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * 18, y * 18);
      if (y * 18 > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    });
  }, 50);
}
startMatrix();
</script>
<script>
let juegos = [], currentCat = "ALL", favoritos = [], recientes = [];
const leer = (k) => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch { return []; } };
favoritos = leer("ethos_favs"); recientes = leer("ethos_recent");

const lista = $("lista"), catBar = $("catBar"), searchBar = $("searchBar");

const ph = nombre => "data:image/svg+xml," + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="160"><rect width="100%" height="100%" fill="#112233"/>` +
  `<text x="50%" y="50%" fill="#00ff9d" font-family="monospace" font-size="42" text-anchor="middle" dominant-baseline="central">` +
  `${esc((nombre || "GAME").substring(0, 8).toUpperCase())}</text></svg>`);

async function cargarJuegos() {
  lista.innerHTML = '<div class="card skeleton"></div>'.repeat(6);
  try {
    const snap = await db.collection("games").get();
    juegos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  } catch (e) {
    console.error(e);
    lista.innerHTML = '<div class="empty error">No se pudieron cargar los juegos.<br><br><button class="btn" onclick="cargarJuegos()">Reintentar</button></div>';
  }
}

function render() { generarCategorias(); mostrarJuegos(); }

function generarCategorias() {
  const cuenta = {};
  juegos.forEach(j => { if (j.category) cuenta[j.category] = (cuenta[j.category] || 0) + 1; });
  const btns = [["ALL", "TODOS", juegos.length], ...Object.keys(cuenta).sort().map(t => [t, t.toUpperCase(), cuenta[t]])];
  if (favoritos.length) btns.push(["FAVS", "★ FAVORITOS", favoritos.length]);
  catBar.innerHTML = btns.map(([k, label, n]) =>
    `<button class="cat-btn ${currentCat === k ? "active" : ""}" data-cat="${esc(k)}">${esc(label)}<span class="chip-n">${n}</span></button>`).join("");
}

function tarjeta(j, badge) {
  return `<article class="card" tabindex="0" data-id="${esc(j.id)}">
    ${badge ? `<span class="badge">${badge}</span>` : ""}
    <img src="${esc(safeUrl(j.logo) || ph(j.nombre))}" data-name="${esc(j.nombre)}" alt="${esc(j.nombre)}" loading="lazy">
    <button class="fav" data-fav="${esc(j.nombre)}" aria-label="Favorito">${favoritos.includes(j.nombre) ? "★" : "☆"}</button>
    <h3>${esc(j.nombre || "Sin nombre")}</h3><small>${esc(j.category || "")}</small></article>`;
}

function mostrarJuegos() {
  const f = searchBar.value.trim().toLowerCase();
  const orden = $("sort").value;
  const filtrados = juegos.filter(j =>
    (!f || (j.nombre || "").toLowerCase().includes(f)) &&
    (currentCat === "ALL" || (currentCat === "FAVS" ? favoritos.includes(j.nombre) : j.category === currentCat)))
    .sort((a, b) => orden === "new" ? (b.timestamp || 0) - (a.timestamp || 0) : (a.nombre || "").localeCompare(b.nombre || ""));

  let html = "";
  // "Continuar jugando" solo en la vista principal, sin búsqueda
  const rec = recientes.map(n => juegos.find(j => j.nombre === n)).filter(Boolean).slice(0, 4);
  if (!f && currentCat === "ALL" && rec.length) {
    html += `<h2 class="sec-title">CONTINUAR JUGANDO</h2>` + rec.map(j => tarjeta(j)).join("") + `<h2 class="sec-title">TODOS LOS JUEGOS</h2>`;
  }
  html += filtrados.length ? filtrados.map(j => tarjeta(j)).join("")
    : `<p class="empty">${juegos.length ? "Ningún juego coincide con tu búsqueda." : "Aún no hay juegos. Añade el primero desde el panel Admin."}</p>`;
  lista.innerHTML = html;
  $("counter").textContent = `${filtrados.length} JUEGO${filtrados.length === 1 ? "" : "S"}`;
}

lista.addEventListener("error", e => {
  const img = e.target;
  if (img.tagName === "IMG" && !img.src.startsWith("data:")) img.src = ph(img.dataset.name);
}, true);

lista.addEventListener("click", e => {
  const fav = e.target.closest("[data-fav]");
  if (fav) {
    const n = fav.dataset.fav;
    favoritos = favoritos.includes(n) ? favoritos.filter(f => f !== n) : [...favoritos, n];
    localStorage.setItem("ethos_favs", JSON.stringify(favoritos));
    if (currentCat === "FAVS" && !favoritos.length) currentCat = "ALL";
    return render();
  }
  const card = e.target.closest(".card[data-id]");
  if (card) abrirJuego(juegos.find(j => j.id === card.dataset.id));
});
lista.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.classList.contains("card")) e.target.click();
});
catBar.addEventListener("click", e => {
  const b = e.target.closest("[data-cat]");
  if (b) { currentCat = b.dataset.cat; render(); }
});
searchBar.addEventListener("input", mostrarJuegos);
$("sort").addEventListener("change", mostrarJuegos);

function abrirJuego(j) {
  const url = j && safeUrl(j.url);
  if (!url) return toast("La URL de este juego no es válida", true);
  recientes = [j.nombre, ...recientes.filter(n => n !== j.nombre)].slice(0, 8);
  localStorage.setItem("ethos_recent", JSON.stringify(recientes));
  $("playerTitle").textContent = j.nombre || "";
  $("playerFrame").src = url;
  $("player").classList.add("open");
  document.body.style.overflow = "hidden";
}
function cerrarJuego() {
  $("playerFrame").src = "about:blank";
  $("player").classList.remove("open");
  document.body.style.overflow = "";
  mostrarJuegos();
}
function abrirBlank() {
  const url = $("playerFrame").src;
  const w = window.open("about:blank", "_blank");
  if (!w) return toast("Permite las ventanas emergentes para abrir el juego", true);
  w.document.title = $("playerTitle").textContent;
  w.document.body.style.cssText = "margin:0;background:#000;height:100vh";
  const f = w.document.createElement("iframe");
  f.style.cssText = "width:100%;height:100%;border:0";
  f.allow = "fullscreen; autoplay; gamepad"; f.src = url;
  w.document.body.appendChild(f);
  cerrarJuego();
}
$("btnClose").onclick = cerrarJuego;
$("btnBlank").onclick = abrirBlank;
$("btnFull").onclick = () => $("playerFrame").requestFullscreen?.();
$("btnReload").onclick = () => { const f = $("playerFrame"); f.src = f.src; };
$("btnRandom").onclick = () => {
  if (!juegos.length) return toast("Aún no hay juegos", true);
  abrirJuego(juegos[Math.floor(Math.random() * juegos.length)]);
};
$("btnAI").onclick = () => window.open("https://script.google.com/macros/s/AKfycbw9TPeZki-pAXzV_S3_OHvpP9fC-5k9yU-UVNfJVSGVor3ls6IvcYvkDGKJg-FH_nwl/exec", "_blank", "noopener");
$("btnSpotify").onclick = () => window.open("https://open.spotify.com/embed/playlist/4L7KXkQeIQpxWNdXMfBVSM", "_blank", "noopener");

addEventListener("keydown", e => {
  const abierto = $("player").classList.contains("open");
  if (e.key === "Escape" && abierto) cerrarJuego();
  if (e.key === "/" && !abierto && document.activeElement !== searchBar) { e.preventDefault(); searchBar.focus(); }
});

cargarJuegos();
</script>
</body>
